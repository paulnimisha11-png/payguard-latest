name: Build Android app

on:
  push:
    paths:
      - "android-upi-intercept/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-upi-intercept
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        # Optional: set a repository variable PAYGUARD_SERVER (Settings → Secrets and variables → Actions → Variables)
        # to bake your server address into the app. Users can still change it in the app.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PpayguardServer="${{ vars.PAYGUARD_SERVER }}"
          cp app/build/outputs/apk/release/app-release.apk PayGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PayGuard-apk
          path: android-upi-intercept/PayGuard.apk

      - name: Publish as a downloadable release (phone-friendly link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: PayGuard Android (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest PayGuard Android build from commit ${{ github.sha }}.
            On your phone, open this page and tap **PayGuard.apk** to download and install.
          files: android-upi-intercept/PayGuard.apk
