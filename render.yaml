# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: payguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APKXRAY_RATE_PER_MIN
        value: "60"
      # After the Android build runs on GitHub, point the website's "Download the app" button at it:
      # - key: APKXRAY_APP_APK_URL
      #   value: https://github.com/<you>/<repo>/releases/download/android-latest/PayGuard.apk
