# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: payguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APKXRAY_RATE_PER_MIN
        value: "60"
      - key: APKXRAY_WORKERS      # one APK analysis process: leaves memory for RapidOCR on the 512 MB free plan
        value: "1"
      - key: OCR_ENGINE          # RapidOCR = accurate engine (18/18 on our receipt tests); "tesseract" = low-memory fallback
        value: "rapidocr"
      - key: APKXRAY_OCR_ENGINE
        value: "rapidocr"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # After the Android build runs on GitHub, point the website's "Download the app" button at it:
      # - key: APKXRAY_APP_APK_URL
      #   value: https://github.com/<you>/<repo>/releases/download/android-latest/PayGuard.apk

