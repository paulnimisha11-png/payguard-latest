# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: payguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APKXRAY_RATE_PER_MIN
        value: "60"
      - key: APKXRAY_WORKERS      # one APK analysis process: leaves memory for RapidOCR on the 512 MB free plan
        value: "1"
      - key: OCR_ENGINE          # Tesseract: ~1 s per screenshot. RapidOCR is ~4x slower and times out (504) on the free plan's shared CPU
        value: "tesseract"
      - key: APKXRAY_OCR_ENGINE
        value: "tesseract"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # AI analyst for APK scans (Gemini). Optional; the scanner works without it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      # ---- Sign-in (Clerk). Set the values in the Render dashboard (Clerk Dashboard → API keys); never commit them. ----
      - key: CLERK_PUBLISHABLE_KEY   # pk_test_… (public; the server hands it to the browser)
        sync: false
      - key: CLERK_SECRET_KEY        # sk_test_… (secret; server only)
        sync: false
      - key: CLERK_JWT_KEY           # optional: "JWKS Public Key" PEM (paste it as is), verifies session tokens without a network call
        sync: false
      # ---- Accounts (history, login-alert emails). Set these in the Render dashboard; they are secrets. ----
      # Render's free disk is wiped on every deploy/restart, so accounts must live in a hosted Postgres
      # (free: Supabase → Project settings → Database → Connection string → "Transaction pooler", port 6543).
      - key: DATABASE_URL
        sync: false
      # Email: Render blocks SMTP on the free plan, so use an HTTP email API. Brevo's free plan sends 300/day.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM            # a sender address you verified in Brevo (Senders & IP → Senders)
        sync: false
      - key: MAIL_FROM_NAME
        value: "PayGuard"
      - key: PUBLIC_URL           # this site's address, e.g. https://payguard-latest.onrender.com: used in email links, and
                                  # Clerk session tokens are only accepted when they were issued for it
        sync: false
      # After the Android build runs on GitHub, point the website's "Download the app" button at it:
      # - key: APKXRAY_APP_APK_URL
      #   value: https://github.com/<you>/<repo>/releases/download/android-latest/PayGuard.apk

