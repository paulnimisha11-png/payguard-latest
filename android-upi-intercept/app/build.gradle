plugins {
    id 'com.android.application'
}

def server = (project.findProperty('payguardServer') ?: '').toString().trim()

android {
    namespace 'app.payguard.shield'
    compileSdk 34

    defaultConfig {
        applicationId 'app.payguard.shield'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${server}\""
    }

    buildFeatures {
        buildConfig true
    }

    // One shared demo key so builds from GitHub Actions and Android Studio can update each other.
    // Replace with a private key (kept out of git) before publishing anywhere public.
    signingConfigs {
        shared {
            storeFile file('payguard-demo.keystore')
            storePassword 'payguard'
            keyAlias 'payguard'
            keyPassword 'payguard'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google code scanner: full-screen QR scanner provided by Google Play services, no camera permission needed.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
